[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-platform-backend"
version = "0.1.0"
description = "Backend de la plataforma web del Proyecto Recon Facial."
requires-python = ">=3.14,<3.15"

dependencies = [
    "Flask==3.1.3",
    "SQLAlchemy==2.0.54",
    "Flask-SQLAlchemy==3.1.1",
    "Alembic==1.20.0",
    "Flask-Migrate==4.1.0",
    "PyMySQL[rsa]==1.2.2",
    "tzdata==2026.5",
]

[dependency-groups]
test = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "mysql_integration: pruebas reales de MySQL con activación explícita",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
