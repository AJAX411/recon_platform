worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 16k;

    # Endpoint interno de proceso Nginx, no de API, DB o autenticación.
    server {
        listen 8080;
        server_name localhost;
        location = /_frontend_liveness { return 200 "frontend vivo\n"; }
        location / { return 444; }
    }
    server {
        listen 8443 ssl;
        server_name localhost 127.0.0.1;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        index index.html;
        # Adaptar DNS/TLS para Azure en etapa independiente, no aquí.
        if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 444; }
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        location /api/v1/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header Forwarded "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
        }
        location = /api/v1 { return 404; }
        location = /_diagnostico {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
        }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
